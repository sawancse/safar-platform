<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:96px;height:96px;overflow:hidden;background:transparent;}
  .wrap{width:96px;height:96px;display:flex;align-items:center;justify-content:center;background:transparent;}
</style></head><body>
  <!-- Android notification icons use ONLY the alpha channel and are tinted one
       color, so the suitcase is a solid white silhouette with the center latch
       rendered as a TRANSPARENT gap (two body halves) so it stays visible. -->
  <div class="wrap">
    <svg width="80" height="80" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M37 26 V22 a6 6 0 0 1 6-6 h14 a6 6 0 0 1 6 6 V26" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none"/>
      <rect x="20" y="28" width="26" height="50" rx="8" fill="#fff"/>
      <rect x="54" y="28" width="26" height="50" rx="8" fill="#fff"/>
    </svg>
  </div>
</body></html>
