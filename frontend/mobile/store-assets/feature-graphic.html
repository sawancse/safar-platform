<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1024px; height:500px; overflow:hidden; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: linear-gradient(120deg, #f97316 0%, #fb923c 45%, #ea580c 100%);
    color:#fff; position:relative;
  }
  /* subtle decorative circles */
  .blob { position:absolute; border-radius:50%; opacity:0.12; background:#fff; }
  .b1 { width:380px; height:380px; right:-90px; top:-120px; }
  .b2 { width:240px; height:240px; right:160px; bottom:-110px; opacity:0.10; }
  .b3 { width:120px; height:120px; left:-40px; bottom:-30px; opacity:0.10; }
  .wrap { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; justify-content:center; padding:0 70px; }
  .brand { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .logo-badge { width:62px; height:62px; border-radius:16px; background:#fff; display:flex; align-items:center; justify-content:center; font-size:34px; box-shadow:0 8px 24px rgba(0,0,0,.18); }
  .brand-name { font-size:46px; font-weight:800; letter-spacing:-1px; }
  .headline { font-size:40px; font-weight:800; line-height:1.12; letter-spacing:-1px; max-width:780px; text-shadow:0 2px 10px rgba(0,0,0,.12); }
  .sub { margin-top:18px; font-size:21px; font-weight:600; opacity:.95; }
  .chips { margin-top:26px; display:flex; gap:12px; flex-wrap:wrap; }
  .chip { background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); padding:9px 16px; border-radius:100px; font-size:16px; font-weight:600; backdrop-filter:blur(2px); }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="wrap">
    <div class="brand">
      <div class="logo-badge">🧳</div>
      <div class="brand-name">BhramanKaro</div>
    </div>
    <div class="headline">India&rsquo;s all-in-one travel &amp; living marketplace</div>
    <div class="sub">Book stays, PGs, flights, home chefs &amp; event services</div>
    <div class="chips">
      <span class="chip">🏡 Stays</span>
      <span class="chip">🛏️ PG &amp; Co-living</span>
      <span class="chip">✈️ Flights</span>
      <span class="chip">👨‍🍳 Home Chefs</span>
      <span class="chip">🎉 Events</span>
      <span class="chip">🛡️ Insurance</span>
    </div>
  </div>
</body>
</html>
