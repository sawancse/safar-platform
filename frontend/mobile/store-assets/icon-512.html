<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:512px; height:512px; overflow:hidden; }
  .icon {
    width:512px; height:512px;
    background:linear-gradient(150deg,#fb923c 0%,#f97316 45%,#ea580c 100%);
    display:flex; align-items:center; justify-content:center;
  }
</style>
</head>
<body>
  <div class="icon">
    <!-- White suitcase mark, centered -->
    <svg width="300" height="300" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- handle -->
      <path d="M37 26 V22 a6 6 0 0 1 6-6 h14 a6 6 0 0 1 6 6 V26" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none"/>
      <!-- body -->
      <rect x="20" y="28" width="60" height="50" rx="9" fill="#ffffff"/>
      <!-- center latch line -->
      <rect x="46.5" y="28" width="7" height="50" fill="#f97316"/>
      <!-- two clasp dots -->
      <circle cx="50" cy="34.5" r="2.4" fill="#f97316"/>
    </svg>
  </div>
</body>
</html>
